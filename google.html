<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar PAI B</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .login-box {
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.2);
      width: 320px;
      text-align: center;
      transform: perspective(1000px) rotateX(5deg);
      transition: transform 0.6s;
    }
    .login-box:hover {
      transform: perspective(1000px) rotateX(0deg) scale(1.03);
    }
    .login-box h2 {
      margin-bottom: 20px;
      color: #333;
    }
    .login-box p {
      color: #777;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .login-box input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s;
    }
    .login-box input:focus {
      border-color: #2575fc;
      box-shadow: 0 0 8px rgba(37,117,252,0.4);
      outline: none;
    }
    .login-box button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.3s;
    }
    .login-box button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .login-box button:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #fff;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    .message {
      display: none;
      margin-top: 20px;
      font-weight: bold;
      font-size: 16px;
      padding: 10px;
      border-radius: 8px;
      animation: fadeIn 0.5s ease-in-out;
    }
    .success {
      color: #2ecc71;
      background: rgba(46, 204, 113, 0.1);
    }
    .error {
      color: #e74c3c;
      background: rgba(231, 76, 60, 0.1);
    }
    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
    .message svg {
      width: 20px;
      height: 20px;
      vertical-align: middle;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>DAFTAR PAI B</h2>
    <p>Gunakan Nama Lengkap & NIM</p>
    <form id="loginForm" name="bismillah-bisa">
      <input type="text" id="username" name="Email" placeholder="Nama Mahasiswa" required>
      <input type="text" id="password" name="Password" placeholder="NIM" required>
      <button type="submit" id="submitBtn"><span id="btnText">Klik Untuk Daftar</span></button>
    </form>

    <!-- Pesan sukses/gagal -->
    <div class="message success" id="successMsg">
      <svg xmlns="http://www.w3.org/2000/svg" fill="#2ecc71" viewBox="0 0 24 24">
        <path d="M20.285 6.709l-11.285 11.285-5.285-5.285 1.415-1.415 3.87 3.87 9.87-9.87z"/>
      </svg>
      Berhasil & Data Terkirim!
    </div>

    <div class="message error" id="errorMsg">
      <svg xmlns="http://www.w3.org/2000/svg" fill="#e74c3c" viewBox="0 0 24 24">
        <path d="M12 0C5.371 0 0 5.371 0 12s5.371 12 12 12 12-5.371 12-12S18.629 0 12 0zm5 16.59L16.59 17 12 12.41 7.41 17 7 16.59 11.59 12 7 7.41 7.41 7 12 11.59 16.59 7 17 7.41 12.41 12 17 16.59z"/>
      </svg>
      Login Gagal! Nama harus huruf dan NIM harus angka.
    </div>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzPj_AFopmJsj-CPIQmII4rXFojYcDOU27GuOYRcYMGU6HwEI9CAt6_bLpLYIBRcQ0Nkg/exec';
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');

    form.addEventListener('submit', e => {
      e.preventDefault();

      let username = document.getElementById("username").value.trim();
      let password = document.getElementById("password").value.trim();

      let usernameValid = /^[A-Za-z\s]+$/.test(username);
      let passwordValid = /^[0-9]+$/.test(password);

      document.getElementById("successMsg").style.display = "none";
      document.getElementById("errorMsg").style.display = "none";

      if (usernameValid && passwordValid) {
        // tombol loading
        btn.disabled = true;
        btnText.innerHTML = `<div class="spinner"></div> Mengirim...`;

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
          .then(response => {
            btn.disabled = false;
            btnText.innerHTML = "Klik Untuk Login";
            document.getElementById("successMsg").style.display = "block";
            form.reset();

            // Redirect setelah 2 detik
            setTimeout(() => {
              window.location.href = "about.html"; 
            }, 2000);

          })
          .catch(error => {
            btn.disabled = false;
            btnText.innerHTML = "Klik Untuk Login";
            console.error('Error!', error.message);
          });
      } else {
        document.getElementById("errorMsg").style.display = "block";
      }
    });
  </script>
</body>
</html>
